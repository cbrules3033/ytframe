name: Windows build
on:
  push:
    branches: [main, 'polish/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
      - name: Test
        run: go test -count=1 -v ./cmd/ytframe
      # Win32 callbacks receive pointers as uintptr; vet cannot track their provenance.
      - name: Vet
        run: go vet -unsafeptr=false ./cmd/ytframe
      - name: Package with verified dependencies
        shell: pwsh
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: YTFrame-win64-unsigned
          path: |
            dist/YTFrame-win64.zip
            dist/YTFrame-win64.sha256
          if-no-files-found: error
          retention-days: 14
